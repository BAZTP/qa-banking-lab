name: Mini Banca Java
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-api-and-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-bank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unitarias, REST Assured y aislamiento de entrenamiento
        run: ./mvnw --batch-mode clean verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ../requirements.lock
      - run: python -m playwright install --with-deps chromium
      - name: Navegador sobre banca normal
        run: python qa/browser_check.py
      - name: Reproducción de ejercicios en navegador aislado
        run: python qa/browser_check.py --training
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-results
          path: |
            java-bank/target/surefire-reports/
            test-results/java-browser/
