name: QA Banking Lab
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - name: Unitarias, API, integración y BDD
        run: python -m pytest -m "not e2e" --cov=app --cov-fail-under=90 --cov-report=xml --junitxml=test-results/api.xml
      - name: Ejercicios aislados (XFAIL esperados)
        run: python -m pytest exercises -rx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-results
          path: |
            test-results/
            coverage.xml
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m playwright install --with-deps chromium
      - name: Recorridos reales Chromium
        run: python scripts/run_e2e.py --browser chromium --tracing retain-on-failure --screenshot only-on-failure --junitxml=test-results/e2e.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results/
